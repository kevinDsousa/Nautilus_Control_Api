# ==============================================================
# = Propriedades do Servidor
# ==============================================================
spring.application.name=nautilus_control_api
server.port = 8080
server.servlet.context-path=/api
server.error.include-message=always
spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER

# ==============================================================
# = Propriedades do banco de dados (H2 em arquivo)
# ==============================================================
spring.datasource.url=jdbc:h2:file:./data/nautilus;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ==============================================================
#   Chave de criptografia das credenciais de hosts Docker
#   (AES-256, 32 bytes em base64 - gerar com: openssl rand -base64 32)
# ==============================================================
app.encryption.key=${APP_ENCRYPTION_KEY:}

# ==============================================================
# = Propriedades da api docker
# ==============================================================
docker.socket.path=unix:///var/run/docker.sock

# ==============================================================
#   Propriedades do JWT
# ==============================================================
jwt.time.minutes.exp=1440
jwt.refresh.time.days.exp=30
jwt.private.key=classpath:app.key
jwt.public.key=classpath:app.pub

# ==============================================================
#   Swagger properties
# ==============================================================
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.path=/docs

# ==============================================================
#   Constantes
# ==============================================================
auth.filter.username=admin
auth.filter.password=admin

# =============================================================
#   Firebase properties
# =============================================================
firebase.credential.resource-path=classpath:${SERVICE_ACCOUNT_FILE}
